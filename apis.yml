aid: fooda
name: FoodA
description: >-
  Fooda is a Chicago-based workplace food-service marketplace that brings meals
  from local, independent restaurants directly to corporate offices, hospitals,
  universities, retail locations, and distribution centers. Its technology-enabled
  platform runs restaurant popup dining events, employer-paid meal programs,
  contactless lunch delivery, event catering and boxed lunches, coffee, pantry,
  and micro-market services, plus full cafeteria replacement under the Orange by
  Fooda brand. Fooda works with 2,000+ restaurant partners and serves upwards of
  ten million meals per year, using AI predictive modeling and machine learning
  to match restaurants to locations and schedule thousands of events. Sibling
  brands include Foodsby and Fooda for Restaurants. Fooda is a 500 Global
  portfolio company. It publishes no public developer API or partner developer
  portal; this profile captures its public web presence and domain-security
  posture.
